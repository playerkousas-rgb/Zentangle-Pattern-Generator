<?xml version="1.0" encoding="UTF-8"?>
<!-- 16×16 手繪版（唔係由 1024 縮細）：三層色 — 夜空、白畫磚、青色重點。
     整數座標、無漸變、無細節，縮到 16px 仍然認得。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#02133E"/>
  <rect x="2" y="2" width="12" height="12" fill="#F7F5EF"/>
  <rect x="4" y="4" width="8" height="8" fill="none" stroke="#14131A" stroke-width="1"/>
  <rect x="6" y="6" width="4" height="4" fill="none" stroke="#14131A" stroke-width="1"/>
  <rect x="12" y="2" width="3" height="3" fill="#00D4FF"/>
</svg>
