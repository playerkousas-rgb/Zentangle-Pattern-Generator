<?xml version="1.0" encoding="UTF-8"?>
<!-- maskable 版（512／192）：同母圖同一設計，但主體收喺中央 66% 安全區，
     邊緣只放背景色同低對比裝飾，Android 裁圓／裁方都唔會切走畫磚。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02133E"/>
      <stop offset="0.55" stop-color="#052255"/>
      <stop offset="1" stop-color="#0A2C66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 主體：480／1024 = 47%，穩坐中央 66% 安全區 -->
  <g transform="rotate(-8 512 512)">
    <rect x="272" y="272" width="480" height="480" rx="22" fill="#F7F5EF"/>
    <rect x="318" y="318" width="388" height="388" fill="none" stroke="#14131A" stroke-width="8"/>

    <g fill="none" stroke="#14131A" stroke-width="11" stroke-linecap="round">
      <path d="M318 434 A 116 116 0 0 1 434 318"/>
      <path d="M318 394 A 76 76 0 0 1 394 318"/>
    </g>
    <g stroke="#14131A" stroke-width="9" stroke-linecap="round">
      <path d="M520 328 L 706 328"/>
      <path d="M520 366 L 706 366"/>
      <path d="M552 404 L 706 404"/>
      <path d="M584 442 L 706 442"/>
    </g>
    <g fill="none" stroke="#14131A" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
      <path d="M342 596 L 384 562 L 426 596 L 468 562 L 510 596"/>
      <path d="M342 638 L 384 604 L 426 638 L 468 604 L 510 638"/>
    </g>
    <g transform="translate(640 574)">
      <path d="M0 -54 L 54 0 L 0 54 L -54 0 Z" fill="none" stroke="#14131A" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="10" fill="#14131A"/>
    </g>
    <circle cx="512" cy="512" r="22" fill="#02133E"/>
    <circle cx="512" cy="512" r="38" fill="none" stroke="url(#cyan)" stroke-width="10"/>
  </g>

  <circle cx="708" cy="316" r="62" fill="none" stroke="#00D4FF" stroke-width="20"/>
</svg>
