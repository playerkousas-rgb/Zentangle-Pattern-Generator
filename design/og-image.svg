  <g fill="#FFFFFF" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="588" y="232" font-size="72" font-weight="bold" letter-spacing="2">ZENTANGLE</text>
    <text x="590" y="296" font-size="42" font-weight="bold" fill="#00D4FF" letter-spacing="1">Pattern Generator</text>
    <text x="590" y="368" font-size="25" fill="#C9D6EE">45 tangle patterns · auto subject extraction</text>
    <text x="590" y="406" font-size="25" fill="#C9D6EE">smart regions · runs 100% in your browser</text>
  </g>
  <rect x="590" y="446" width="120" height="4" rx="2" fill="url(#cyan)"/>
  <text x="590" y="500" font-size="21" fill="#7FA6D9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">zentangle-pattern-generator.vercel.app</text>
