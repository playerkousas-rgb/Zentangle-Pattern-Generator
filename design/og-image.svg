      <path d="M40 120 A 80 80 0 0 1 120 40"/>
    </g>
    <g stroke="#14131A" stroke-width="8" stroke-linecap="round">
      <path d="M220 66 L 380 66"/>
      <path d="M220 102 L 380 102"/>
      <path d="M250 138 L 380 138"/>
      <path d="M280 174 L 380 174"/>
    </g>
    <g fill="none" stroke="#14131A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 268 L 100 238 L 138 268 L 176 238 L 214 268"/>
      <path d="M62 306 L 100 276 L 138 306 L 176 276 L 214 306"/>
    </g>
    <circle cx="210" cy="210" r="18" fill="#02133E"/>
