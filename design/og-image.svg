<?xml version="1.0" encoding="UTF-8"?>
<!-- Open Graph 分享圖 1200×630：深藍夜空 ＋ 白色畫磚禪繞 ＋ 英文標題。
     og:image 必須用絕對網址引用（見 index.html <head>）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02133E"/>
      <stop offset="0.6" stop-color="#052255"/>
      <stop offset="1" stop-color="#0A2C66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 左：畫磚主體 -->
  <g transform="translate(84 108) rotate(-7 210 210)">
    <rect x="0" y="0" width="420" height="420" rx="18" fill="#F7F5EF"/>
    <rect x="40" y="40" width="340" height="340" fill="none" stroke="#14131A" stroke-width="7"/>
    <g fill="none" stroke="#14131A" stroke-width="9" stroke-linecap="round">
