<?xml version="1.0" encoding="UTF-8"?>
<!-- 圖標母圖（1024×1024）：全滿版、四色以上、主體置中約 60%。
     由 scripts/build_icons.mjs 以 sharp 輸出 9 個 PNG／ICO（docs/33 G11 規範）。
     唔准直接放進 public/ 部署。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02133E"/>
      <stop offset="0.55" stop-color="#052255"/>
      <stop offset="1" stop-color="#0A2C66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>

  <!-- 背景：滿版夜空 -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 邊緣裝飾：襌繞串線（唔會擋住主體，maskable 裁切都安全） -->
  <g fill="none" stroke="url(#cyan)" stroke-linecap="round" opacity="0.5">
    <path d="M-40 250 C 120 210, 190 320, 150 420" stroke-width="14"/>
    <path d="M1074 700 C 930 730, 860 640, 900 540" stroke-width="14"/>
    <path d="M60 960 C 190 900, 300 930, 360 1010" stroke-width="10"/>
    <path d="M980 90 C 870 130, 800 90, 760 10" stroke-width="10"/>
  </g>
  <g fill="#00D4FF" opacity="0.65">
    <circle cx="146" cy="452" r="16"/>
    <circle cx="902" cy="512" r="16"/>
    <circle cx="70" cy="860" r="12"/>
    <circle cx="956" cy="196" r="12"/>
  </g>

  <!-- 主體：白色畫磚 ＋ 墨線禪繞，置中約 60% -->
  <g transform="rotate(-8 512 512)">
    <rect x="202" y="202" width="620" height="620" rx="26" fill="#F7F5EF"/>
    <rect x="262" y="262" width="500" height="500" fill="none" stroke="#14131A" stroke-width="9"/>

    <!-- 左上：同心四分之一圓（printemps 螺旋） -->
    <g fill="none" stroke="#14131A" stroke-width="13" stroke-linecap="round">
      <path d="M262 412 A 150 150 0 0 1 412 262"/>
      <path d="M262 362 A 100 100 0 0 1 362 262"/>
      <path d="M262 312 A 50 50 0 0 1 312 262"/>
    </g>

    <!-- 右上：斜線排線 ＋ 交錯圓點 -->
    <g stroke="#14131A" stroke-width="11" stroke-linecap="round">
      <path d="M520 274 L 722 274"/>
      <path d="M520 314 L 722 314"/>
      <path d="M536 354 L 722 354"/>
      <path d="M568 394 L 722 394"/>
      <path d="M600 434 L 722 434"/>
    </g>
    <g fill="#14131A">
      <circle cx="520" cy="274" r="10"/>
      <circle cx="536" cy="314" r="10"/>
      <circle cx="568" cy="354" r="10"/>
      <circle cx="600" cy="394" r="10"/>
      <circle cx="632" cy="434" r="10"/>
    </g>

    <!-- 左下：人字紋（chevron） -->
    <g fill="none" stroke="#14131A" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <path d="M290 620 L 340 578 L 390 620 L 440 578 L 490 620"/>
      <path d="M290 668 L 340 626 L 390 668 L 440 626 L 490 668"/>
      <path d="M290 716 L 340 674 L 390 716 L 440 674 L 490 716"/>
    </g>

    <!-- 右下：嵌套菱形 ＋ 中心點 -->
    <g transform="translate(672 586)">
      <path d="M0 -70 L 70 0 L 0 70 L -70 0 Z" fill="none" stroke="#14131A" stroke-width="11" stroke-linejoin="round"/>
      <path d="M0 -36 L 36 0 L 0 36 L -36 0 Z" fill="none" stroke="#14131A" stroke-width="11" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="11" fill="#14131A"/>
    </g>

    <!-- 中央：墨點 ＋ 高對比青線（16px 都認得） -->
    <circle cx="512" cy="512" r="26" fill="#02133E"/>
    <circle cx="512" cy="512" r="44" fill="none" stroke="url(#cyan)" stroke-width="12"/>
  </g>

  <!-- 前景高對比形狀：貼住畫磚右上角嘅青環 -->
  <circle cx="756" cy="252" r="80" fill="none" stroke="#00D4FF" stroke-width="24"/>
  <circle cx="768" cy="742" r="34" fill="#7B61FF"/>
</svg>
